name: IASO Plugin setup
description: Resolve matching Iaso branch for a plugin branch, checkout Iaso, nest plugin under plugins/<plugin>.

inputs:
  branch:
    description: Plugin branch to build
    required: true
  plugin:
    description: Plugin name (used as nested path under plugins/)
    required: false
  iaso_repository:
    description: Iaso repository (owner/name)
    required: false
    default: BLSQ/iaso

outputs:
  branch:
    description: Iaso branch chosen
    value: ${{ steps.resolve.outputs.branch }}

runs:
  using: composite
  steps:
    - name: Resolve Iaso branch
      id: resolve
      shell: bash
      env:
        PLUGIN_BRANCH: ${{ inputs.branch }}
        IASO_REPO: ${{ inputs.iaso_repository }}
      run: |
        echo "Plugin branch is '${PLUGIN_BRANCH}'"
        if git ls-remote --exit-code --heads "https://github.com/${IASO_REPO}.git" "${PLUGIN_BRANCH}" >/dev/null 2>&1; then
          echo "Matching branch '${PLUGIN_BRANCH}' found in ${IASO_REPO}."
          echo "branch=${PLUGIN_BRANCH}" >> "$GITHUB_OUTPUT"
        else
          echo "No matching branch in ${IASO_REPO}. Using default 'develop'."
          echo "branch=develop" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout Iaso
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.iaso_repository }}
        ref: ${{ steps.resolve.outputs.branch }}

    - name: Checkout plugin nested under plugins/${{ inputs.plugin }}
      if: inputs.plugin != ''
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.branch }}
        path: plugins/${{ inputs.plugin }}

    - name: Verify layout
      if: inputs.plugin != ''
      shell: bash
      env:
        PLUGIN: ${{ inputs.plugin }}
      run: |
        ls -las
        ls -las plugins
        ls -las "plugins/${PLUGIN}"

