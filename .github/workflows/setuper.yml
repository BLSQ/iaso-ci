name: IASO setuper
run-name: Setuper on branch ${{ inputs.iaso_branch }}

on:
  workflow_call:
    inputs:
      iaso_branch:
        description: IASO branch to test
        required: true
        type: string

jobs:
  setuper:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_actions
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a health check
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DEBUG: true
      DJANGO_SETTINGS_MODULE: hat.settings
      DJANGO_SUPERUSER_EMAIL: admin@iaso.com
      DJANGO_SUPERUSER_PASSWORD: iaso
      DJANGO_SUPERUSER_USERNAME: iaso
      RDS_DB_NAME: github_actions
      RDS_HOSTNAME: localhost
      RDS_PASSWORD: postgres
      RDS_PORT: 5432
      RDS_USERNAME: postgres
      SECRET_KEY: secret
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - name: Checkout IASO code
        uses: actions/checkout@v6
        with:
          repository: 'BLSQ/iaso'
          ref: ${{ inputs.iaso_branch }}

      - name: Install Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install GDAL and gettext
        run: |
          # skip the Azure apt mirror: it's sometimes extremely slow, fall back to archive.ubuntu.com & co
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          # pinning libgdal34t64 because it's the closest available to libgdal32 in the prod Dockerfile
          sudo apt-get update && sudo apt install libgdal34t64

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
          cache-suffix: tests

      - name: Install backend dependencies
        run: uv sync --locked --no-dev --group setuper

      - name: Environment info
        run: uv tree --all-groups

      - name: Migrate database
        run: |
          uv run python manage.py migrate
          uv run python manage.py createcachetable

      - name: Create superuser
        run: uv run python manage.py createsuperuser --noinput

      - name: Run local server for setuper
        run: nohup uv run python manage.py runserver 0.0.0.0:8081 > django.log 2>&1 &

      - name: Wait for local server to be ready
        run: |
          for i in $(seq 1 60); do
            # any HTTP response (even a redirect or 404) means the server is accepting requests
            if curl -s -o /dev/null http://localhost:8081/; then
              echo "Django server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Django server did not start within 2 minutes"
          cat django.log
          exit 1

      - name: Start local worker
        run: nohup uv run python manage.py tasks_worker > worker.log 2>&1 &

      - name: Run setuper
        run: |
          uv run --only-group setuper python setuper/setuper.py \
            -u ${{ env.DJANGO_SUPERUSER_USERNAME }} \
            -p ${{ env.DJANGO_SUPERUSER_PASSWORD }} \
            -s "http://localhost:8081" \
            -a \
            -n nightly

      - name: Show Django server log
        if: always()
        run: cat django.log || true

      - name: Show worker log
        if: always()
        run: cat worker.log || true

      - name: Minimize uv cache
        run: uv cache prune --ci
