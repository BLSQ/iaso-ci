name: Build IASO docker prod image
run-name: Build docker image with tags ${{ inputs.image_tags }}

on:
  workflow_call:
    inputs:
      image_tags:
        description: Tag(s) to push the image with (comma-separated if multiple, e.g. "latest,develop"). The "blsq/<repo>:" prefix is added automatically.
        required: true
        type: string
      iaso_branch:
        description: Branch to build
        required: true
        type: string
      plugin_branch:
        description: Plugin branch to build
        required: false
        type: string
        default: ''
      plugin_name:
        description: Plugin name (determines in which repo is image is going to be stored)
        required: false
        type: string
        default: ''

jobs:
  docker_build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if : ${{ inputs.plugin_branch != '' }}
    steps:
      - name: Received parameters
        run: |
          echo "IASO branch: ${{ inputs.iaso_branch }}"
          echo "Plugin branch: ${{ inputs.plugin_branch }}"
          echo "Plugin name: ${{ inputs.plugin_name }}"
          echo "Image tags: ${{ inputs.image_tags }}"

      - name: Checkout IASO code
        uses: actions/checkout@v6
        with:
          repository: 'BLSQ/iaso'
          ref: ${{ inputs.iaso_branch }}

      - name: Checkout plugin code
        if: inputs.plugin_branch != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.plugin_branch }}
          path: plugins/${{ inputs.plugin_name }}

      - name: Verify layout
        if: inputs.plugin_branch != ''
        run: |
          ls -las
          ls -las plugins
          ls -las plugins/${{ inputs.plugin_name }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Building IASO image based on iaso branch ${{ inputs.iaso_branch }}
        run: |
          echo "
           ___    _    ____   ___
          |_ _|  / \  / ___| / _ \\
           | |  / _ \ \___ \| | | |
           | | / ___ \ ___) | |_| |
          |___/_/   \_\____/ \___/
          ------------------------
          Building IASO image based on iaso branch ${{ inputs.iaso_branch }} - plugin branch ${{ inputs.plugin_branch }}
          $(date)
          "

      - name: Determine image repository based on plugin name
        id: repo
        run: |
          if [ -n "${{ inputs.plugin_name }}" ]; then
            echo "repo=${{ inputs.plugin_name }}" >> $GITHUB_OUTPUT
          else
            echo "repo=iaso" >> $GITHUB_OUTPUT
          fi

      - name: Format image tags
        id: tags
        env:
          INPUT_TAGS: ${{ inputs.image_tags }}
        run: |
          echo "value=$(echo "$INPUT_TAGS" | tr ',' '\n' | sed 's|^|blsq/${{ steps.repo.outputs.repo }}:|' | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.value }}
          # https://docs.docker.com/build/cache/backends/
          cache-from: type=registry,ref=blsq/${{ steps.repo.outputs.repo }}:buildcache
          cache-to: type=registry,ref=blsq/${{ steps.repo.outputs.repo }}:buildcache,mode=max
