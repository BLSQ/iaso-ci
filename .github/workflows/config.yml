name: IASO config (short sha, image_tags, ticket code, branches to use)

# determine IASO branch from config if the plugin has some custom loging for building

on:
  workflow_call:
    inputs:
      branch:
        description: PR Branch name
        required: true
        type: string
      pr_title:
        description: PR Title
        required: true
        type: string
      plugin_name:
        description: Plugin name
        required: false
        type: string
        default: ''

    outputs:
      slug:
        description: Parsed ticket code (slug)
        value: ${{ jobs.config.outputs.slug }}
      short_sha:
        description: Short git commit SHA
        value: ${{ jobs.config.outputs.short_sha }}
      image_tags:
        description: Image tags (comma separated)
        value: ${{ jobs.config.outputs.image_tags }}
      iaso_branch:
        description: Resolved iaso branch to build from
        value: ${{ jobs.config.outputs.iaso_branch }}
      plugin_branch:
        description: Resolved plugin branch to build from (if applicable)
        value: ${{ jobs.config.outputs.plugin_branch }}

jobs:
  config:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
      short_sha: ${{ steps.short_sha.outputs.short_sha }}
      image_tags: ${{ steps.image_tags.outputs.image_tags }}
      iaso_branch: ${{ steps.resolve.outputs.iaso_branch }}
      plugin_branch: ${{ steps.resolve.outputs.plugin_branch }}
    steps:
      - name: Determine ticket code (slug) from PR title or branch name. Warn if not found
        id: slug
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          ticket_code=$(echo "${PR_TITLE}" | grep -Eo '[a-zA-Z_]+-[1-9][0-9]*' || true)
          if [ -z "${ticket_code}" ]; then
            echo "Unable to parse ticket code (slug) from PR title ${PR_TITLE}. Trying branch name ${BRANCH}"

            ticket_code=$(echo "${BRANCH}" | grep -Eo '[a-zA-Z_]+(-|_|:|\ )[1-9][0-9]*' || true)

            if [ -z "${ticket_code}" ] && [ -n "${{ github.event.pull_request.number }}" ]; then
              BODY=$(printf "⚠️ **[WARN] Ticket code in PR title (\`%s\`) not found**.\nTried unsuccessfully to parse from branch (\`%s\`).\nImage will not be tagged with a ticket code (slug)." "${PR_TITLE}" "${BRANCH}")
              gh pr comment "${{ github.event.pull_request.number }}" \
                --repo "${{ github.repository }}" \
                --body "${BODY}"
            fi
          fi

          echo "slug=${ticket_code}" >> $GITHUB_OUTPUT

      - name: Determine short sha from github commit sha
        id: short_sha
        run: echo "short_sha=${GITHUB_SHA:0:12}" >> $GITHUB_OUTPUT

      - name: Output PR image tags
        id: image_tags
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          SHORT_SHA: ${{ steps.short_sha.outputs.short_sha }}
          BRANCH: ${{ inputs.branch }}
        run: |
          TAGS="${SHORT_SHA}"
          if [ -n "${SLUG}" ]; then
            TAGS="${SLUG},${TAGS}"
          fi
          if [ "${BRANCH}" = "develop" ] || [ "${BRANCH}" = "main" ] || [ "${BRANCH}" = "develop-test" ]; then
            TAGS="${TAGS},${BRANCH}"
          fi
          echo "image_tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Resolve core and plugin branches
        id: resolve
        run: |
          if [ -n "${{ inputs.plugin_name }}" ]; then
            echo "Resolving plugin branch for '${{ inputs.plugin_name }}'..."
            if git ls-remote --exit-code --heads "https://github.com/BLSQ/iaso.git" "${{ inputs.branch }}" >/dev/null 2>&1; then
              echo "Matching branch '${{ inputs.branch }}' found in BLSQ/iaso."
              echo "iaso_branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
              echo "plugin_branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            else
              echo "No matching branch in BLSQ/iaso. Using default 'develop'."
              echo "iaso_branch=develop" >> "$GITHUB_OUTPUT"
              echo "plugin_branch=''" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No plugin, core iaso only..."
            echo "iaso_branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "plugin_branch=''" >> "$GITHUB_OUTPUT"
          fi
