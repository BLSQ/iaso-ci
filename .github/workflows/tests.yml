name: Iaso CI testing
run-name: Iaso tests on branch ${{ inputs.iaso_branch }} (plugin branch ${{ inputs.plugin_branch }})
# This workflow can run all backend and frontend tests

on:
  workflow_call:
    inputs:
      iaso_branch:
        description: IASO branch to test
        required: true
        type: string
      plugin_branch:
        description: Plugin branch to test
        required: false
        type: string
        default: ""
      plugin_name:
        description: Plugin name (scopes lint/format to plugins/<plugin>/)
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  node_version: 22.18.0
  npm_version: 11.13.0

jobs:
  frontend_tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Received parameters
        run: |
          echo "IASO branch: ${{ inputs.iaso_branch }}"
          echo "Plugin branch: ${{ inputs.plugin_branch }}"
          echo "Plugin name: ${{ inputs.plugin_name }}"

      - name: Checkout IASO code
        uses: actions/checkout@v6
        with:
          repository: "BLSQ/iaso"
          ref: ${{ inputs.iaso_branch }}

      - name: Checkout plugin code
        if: inputs.plugin_branch != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.plugin_branch }}
          path: plugins/${{ inputs.plugin_name }}

      - name: Verify layout
        if: inputs.plugin_branch != ''
        run: |
          ls -las
          ls -las plugins
          ls -las plugins/${{ inputs.plugin_name }}

      - name: Use node.js ${{ env.node_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node_version }}
          cache: npm

      - name: upgrade npm
        run: |
          npm install --global npm@${{ env.npm_version }}

      - name: Environment info
        run: |
          node --version
          npm --version

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: npm test
        run: npm test

      - name: Check Frontend (JS/React) translations
        run: python scripts/update_trads.py

      - name: Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_USERNAME: ${{ github.workflow }}
          SLACK_ICON_EMOJI: ":robot_face:"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: iaso-dev
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: ${{ format('Job {0} failed on {1}', github.job, github.ref) }}
          SLACK_FOOTER: ${{  format('<https://github.com/{0}/commit/{1}/checks|🔗{2} logs> | <https://github.com/{0}/commit/{1}/checks|🔗 Commit {1}>', github.repository, github.sha, github.job) }}
          MSG_MINIMAL: true
        if: failure()

  backend_tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_actions
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a health check
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      couchdb:
        image: couchdb:1.7
        ports:
          - 5984:5984
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: secret
      redis:
        image: redis
        ports:
          - 6379:6379
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COUCHDB_PASSWORD: secret
      COUCHDB_URL: "http://localhost:5984"
      COUCHDB_USER: admin
      DEBUG: true
      DJANGO_SETTINGS_MODULE: hat.settings
      PLUGINS: ${{ (inputs.plugin_name == '' || contains(fromJSON('["polio","wfp","wfp_auth"]'), inputs.plugin_name)) && 'polio,wfp,wfp_auth' || format('polio,wfp,wfp_auth,{0}', inputs.plugin_name) }}
      RDS_DB_NAME: github_actions
      RDS_HOSTNAME: localhost
      RDS_PASSWORD: postgres
      RDS_PORT: 5432
      RDS_USERNAME: postgres
      REDIS_HOST: localhost
      SECRET_KEY: secret
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - name: Checkout IASO code
        uses: actions/checkout@v6
        with:
          repository: "BLSQ/iaso"
          ref: ${{ inputs.iaso_branch }}

      - name: Checkout plugin code
        if: inputs.plugin_branch != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.plugin_branch }}
          path: plugins/${{ inputs.plugin_name }}

      - name: Verify layout
        if: inputs.plugin_branch != ''
        run: |
          ls -las
          ls -las plugins
          ls -las plugins/${{ inputs.plugin_name }}

      - name: Install Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install GDAL and gettext
        run: sudo apt-get update && sudo apt install gdal-bin gettext

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: tests

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Environment info
        run: uv tree --all-groups

      - name: Check Backend (Django) translations
        run: |
          uv run python manage.py make_translations
          uv run python manage.py compile_translations

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check

      - name: Compute exclusion test tags - don't run trypelim tests if there is no plugin
        id: compute_exclusion_tags
        run: |
          if [ -n "${{ inputs.plugin_name }}" ]; then
            echo "exclusion_tags=--exclude-tag=externaltools" >> $GITHUB_OUTPUT
          else
            echo "exclusion_tags=--exclude-tag=externaltools --exclude-tag=trypelim" >> $GITHUB_OUTPUT
          fi

      - name: Compute test parallelization - don't run tests in parallel if there is a plugin
        id: compute_parallelization
        run: |
          if [ -n "${{ inputs.plugin_name }}" ]; then
            echo "parallelization=" >> $GITHUB_OUTPUT
          else
            echo "parallelization=--parallel auto" >> $GITHUB_OUTPUT
          fi

      - name: Django tests
        run: |
          uv run python manage.py migrate
          uv run python manage.py createcachetable
          uv run python -W "ignore" manage.py test ${{ steps.compute_parallelization.outputs.parallelization }} ${{ steps.compute_exclusion_tags.outputs.exclusion_tags }}

      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_USERNAME: ${{ github.workflow }}
          SLACK_ICON_EMOJI: ":robot_face:"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: iaso-dev
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: ${{ format('Job {0} failed on {1}', github.job, github.ref) }}
          SLACK_FOOTER: ${{  format('<https://github.com/{0}/commit/{1}/checks|🔗{2} logs> | <https://github.com/{0}/commit/{1}/checks|🔗 Commit {1}>', github.repository, github.sha, github.job) }}
          MSG_MINIMAL: true
        if: failure()

  backend_lint_and_format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout IASO code
        uses: actions/checkout@v6
        with:
          repository: "BLSQ/iaso"
          ref: ${{ inputs.iaso_branch }}

      - name: Checkout plugin code
        if: inputs.plugin_branch != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.plugin_branch }}
          path: plugins/${{ inputs.plugin_name }}

      - name: Verify layout
        if: inputs.plugin_branch != ''
        run: |
          ls -las
          ls -las plugins
          ls -las plugins/${{ inputs.plugin_name }}

      - name: Install ruff
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "--version"
          version: "0.9.6"

      - name: Resolve ruff target path
        id: ruff_path
        run: |
          if [ -n "${{ inputs.plugin_name }}" ]; then
            echo "path=plugins/${{ inputs.plugin_name }}/" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Linting with ruff
        run: ruff check --output-format=github ${{ steps.ruff_path.outputs.path }}

      - name: Formatting with ruff
        run: ruff format --check ${{ steps.ruff_path.outputs.path }}

  frontend_lint_and_format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout IASO code
        uses: actions/checkout@v6
        with:
          repository: "BLSQ/iaso"
          ref: ${{ inputs.iaso_branch }}

      - name: Checkout plugin code
        if: inputs.plugin_branch != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.plugin_branch }}
          path: plugins/${{ inputs.plugin_name }}

      - name: Verify layout
        if: inputs.plugin_branch != ''
        run: |
          ls -las
          ls -las plugins
          ls -las plugins/${{ inputs.plugin_name }}

      - name: Use node.js ${{ env.node_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node_version }}
          cache: npm

      - name: upgrade npm
        run: |
          npm install --global npm@${{ env.npm_version }}

      - name: Environment info
        run: |
          node --version
          npm --version

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

        # trypelim has front split in multiple directories, so this is not useful, let's hardcode paths
      - name: Resolve ESLint command
        id: eslint
        run: |
          if [ -n "${{ inputs.plugin_name }}" ]; then
            echo "command=npx eslint \"./plugins/${{ inputs.plugin_name }}/js/**/*.{js,jsx,ts,tsx}\"" >> "$GITHUB_OUTPUT"
          else
            echo "command=npm run show-lint-problems" >> "$GITHUB_OUTPUT"
          fi

      - name: Check ESLint
        run: ${{ steps.eslint.outputs.command }}

